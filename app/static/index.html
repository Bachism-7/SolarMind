<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SolarMind | Sun position</title>
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <main>
    <h1>SolarMind</h1>

    <section class="panel controls">
      <label>Latitude<input id="latitude" type="number" min="-90" max="90" step="any" placeholder="37.7749"></label>
      <label>Longitude<input id="longitude" type="number" min="-180" max="180" step="any" placeholder="-122.4194"></label>
      <label>Date (UTC)<input id="date" type="date"></label>
      <label>Time (UTC)<input id="time-input" type="time" step="60" value="12:00"></label>
      <div class="buttons">
        <button type="button" id="calculate" class="primary">Calculate</button>
        <button type="button" id="now">Now (UTC)</button>
      </div>
      <p id="message" role="status"></p>
    </section>

    <section class="results">
      <div class="panel readout">
        <div id="time" class="time">--:-- UTC</div>
        <div class="angles">
          <div><span>Azimuth</span><strong id="azimuth">-</strong><small>clockwise from north</small></div>
          <div><span>Elevation</span><strong id="elevation">-</strong><small id="daylight">above horizon</small></div>
          <div><span>Panel tilt</span><strong id="tilt">-</strong><small>from horizontal</small></div>
        </div>
        <label class="timeline">Time of day (UTC) <input id="timeline" type="range" min="0" max="0" value="0" disabled></label>
      </div>

      <div class="panel">
        <svg class="sky" viewBox="0 0 300 300" role="img" aria-label="Sky chart: sun path and position">
          <circle class="horizon" cx="150" cy="150" r="112"></circle>
          <circle class="ring" cx="150" cy="150" r="74"></circle>
          <circle class="ring" cx="150" cy="150" r="37"></circle>
          <path class="cross" d="M38 150H262M150 38V262"></path>
          <text x="150" y="23" text-anchor="middle">N</text>
          <text x="282" y="154" text-anchor="middle">E</text>
          <text x="150" y="292" text-anchor="middle">S</text>
          <text x="18" y="154" text-anchor="middle">W</text>
          <path class="track" id="track" d=""></path>
          <circle class="sun" id="sun" cx="150" cy="150" r="7" visibility="hidden"></circle>
        </svg>
      </div>
    </section>

    <section class="panel arm">
      <div class="controls">
        <label>COM port<input id="port" type="text" list="ports" placeholder="COM7" autocomplete="off"><datalist id="ports"></datalist></label>
        <div class="buttons">
          <button type="button" id="preview">Preview commands</button>
          <button type="button" id="send" class="primary" disabled>Send to arm</button>
        </div>
        <label class="check"><input id="confirm" type="checkbox"> The arm is clear to move and calibration is verified.</label>
      </div>
      <pre id="arm-output" aria-live="polite"></pre>
    </section>
  </main>
</body>
</html>
